
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ลดการ Cache หน้า Redirect -->
  <meta http-equiv="Cache-Control"
        content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>กำลังเปิดแบบฟอร์ม...</title>

  <script>
    (function () {
      const target =
        "https://script.google.com/macros/s/AKfycbyun4xK0o96jH6a-U_z2p-_Q2SO4DqZJv-Ui1hjFZhu9jMfm3lhsNPB6IQmQGgtGvs/exec";

      // สร้าง URL ใหม่ทุกครั้งเพื่อเลี่ยง URL Cache
      const url = new URL(target);
      url.searchParams.set("_ts", Date.now().toString());
      url.searchParams.set(
        "_r",
        Math.random().toString(36).slice(2)
      );

      // Redirect โดยไม่เพิ่มประวัติหน้านี้
      window.location.replace(url.toString());
    })();
  </script>
</head>

<body>
  <p>กำลังเปิดแบบฟอร์ม...</p>
  <p>
    หากไม่เปลี่ยนหน้าอัตโนมัติ
    <a href="https://script.google.com/macros/s/AKfycbyun4xK0o96jH6a-U_z2p-_Q2SO4DqZJv-Ui1hjFZhu9jMfm3lhsNPB6IQmQGgtGvs/exec">
      คลิกที่นี่
    </a>
  </p>
</body>
</html>
